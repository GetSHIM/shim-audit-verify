[project]
name = "shim-audit-verify"
version = "0.1.0"
description = "Independent verifier for shim audit evidence bundles"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "shim Engineering" }]
keywords = ["audit", "tamper-evident", "hash-chain", "eu-ai-act", "compliance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
# No runtime dependencies, ever. The auditability of this verifier comes from
# being readable end to end, and every dependency is something an auditor would
# have to read too.
dependencies = []

[project.urls]
Homepage = "https://github.com/GetSHIM/shim-audit-verify"
Repository = "https://github.com/GetSHIM/shim-audit-verify"
Issues = "https://github.com/GetSHIM/shim-audit-verify/issues"
Documentation = "https://github.com/GetSHIM/shim-audit-verify/blob/main/FORMAT.md"
Changelog = "https://github.com/GetSHIM/shim-audit-verify/blob/main/CHANGELOG.md"

[project.scripts]
shim-audit-verify = "shim_audit_verify.cli:main"

[dependency-groups]
dev = [
  "coverage>=7.6,<8",
  "pytest>=9.0.3,<10",
  "ruff>=0.15.22,<0.16",
  "ty>=0.0.65,<0.1",
  "uv-build==0.12.5",
]

[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.5"

[tool.uv.build-backend]
module-name = "shim_audit_verify"
module-root = "src"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RET", "PTH", "RUF", "ANN", "S"]

[tool.ruff.lint.per-file-ignores]
# Turkish and emoji literals are the point of the unicode vectors: they are
# what proves ensure_ascii=False is honoured. RUF001-003 would flag them.
"tests/**" = ["S101", "S311", "RUF001", "RUF002", "RUF003"]
"scripts/**" = ["S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.coverage.run]
branch = true
source = ["shim_audit_verify"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ty.src]
include = ["src"]
